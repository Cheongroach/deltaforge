[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltaforge-gdn"
version = "0.3.0"
description = "Functional Gated DeltaNet backends, compiler experiments and an offline profiling lab"
requires-python = ">=3.11"
dependencies = ["torch>=2.7"]
license = {file = "LICENSE"}

[project.optional-dependencies]
cuda = ["triton>=3.5"]
qwen = ["transformers==5.2.0", "peft==0.18.1", "accelerate==1.11.0", "safetensors==0.8.0"]
fla = ["fla-core==0.4.1", "einops==0.8.1"]

[tool.setuptools]
packages = ["deltaforge"]
